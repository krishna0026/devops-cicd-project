name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  quality-and-test:
    name: Code Quality and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff linting
        run: ruff check .

      - name: Ruff formatting
        run: ruff format --check .

      - name: Run automated tests
        run: python -m pytest -v

  docker-build:
    name: Docker Build, Security Scan and Publish
    runs-on: ubuntu-latest

    needs: quality-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t devops-cicd-project:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devops-cicd-project:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Verify Docker image
        run: |
          docker image inspect \
            devops-cicd-project:${{ github.sha }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag devops-cicd-project:${IMAGE_TAG} ${IMAGE_NAME}:${IMAGE_TAG}

          docker tag devops-cicd-project:${IMAGE_TAG} ${IMAGE_NAME}:latest

          docker push ${IMAGE_NAME}:${IMAGE_TAG}

          docker push ${IMAGE_NAME}:latest
